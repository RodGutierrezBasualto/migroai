          <h2>What Migro Does</h2>
          <p style="font-size:18px;line-height:1.7;margin-top:16px;">Migro is an AI-powered SaaS platform built specifically for Australian MARA-registered migration agents. It replaces 1–3 hours of manual document review per case with a two-minute AI compliance assessment. Upload your entire client document bundle — Migro reads every file simultaneously, cross-references them against visa subclass requirements, and tells you exactly what is valid, expired, missing, or inconsistent.</p>
        </div>

          <div class="ns-grid">
            <div class="ns-card">
              <h3>Document Intelligence</h3>
              <p>Upload an entire client document bundle. Migro cross-references every document against specific Australian visa subclass requirements and produces a compliance dashboard in under two minutes. Supports Subclass 190, 189, 491, 482, 820, 186, 500, 600 and more.</p>
            </div>
            <div class="ns-card">
              <h3>Intake Agent</h3>
              <p>An embeddable AI conversational widget for your practice website. Qualifies inbound visa enquiries automatically, produces a visa pathway pre-assessment, and delivers structured lead information to your dashboard 24/7.</p>
            </div>
            <div class="ns-card">
              <h3>Australian Data Residency</h3>
              <p>All data processed and stored exclusively within Australia — Google Cloud Sydney region (australia-southeast1). No data ever leaves Australian jurisdiction. Fully compliant with the Privacy Act 1988 (Cth) and MARA Code of Conduct.</p>
            </div>
            <div class="ns-card">
              <h3>AI Privacy</h3>
              <p>Zero data retention on all AI inference. Your documents are never used to train AI models. Enforced at the infrastructure level via Google Vertex AI (Gemini 1.5 Pro) within GCP Sydney.</p>
            </div>
          </div>
